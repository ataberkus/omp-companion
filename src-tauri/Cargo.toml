[package]
name = "omp-control-room"
version = "1.0.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: Window::add_child, which lays the in-app browser over the dashboard (open_in_app_browser in src/main.rs).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde_json = "1"
dunce = "1"
parking_lot = "0.12"
tauri-plugin-updater = "2"

# The installer's quit-for-update event (quit_on_installer_request in src/main.rs); the job object that holds Bun and
# everything it starts (src/host.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# Ends Bun's process group (src/host.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
