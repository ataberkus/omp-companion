<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="OMP Control Room">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4fbf"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3fd0e6"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4fbf"/>
      <stop offset=".6" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#3fd0e6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="1" cy="0" r=".8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="1" r=".7">
      <stop offset="0" stop-color="#ec4fbf" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ec4fbf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="20" fill="#09090b"/>
  <rect width="1200" height="280" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="280" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="280" rx="20" fill="url(#glowB)"/>
  <rect x=".5" y=".5" width="1199" height="279" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g transform="translate(80 76)">
    <rect width="128" height="128" rx="30" fill="url(#brand)"/>
    <rect x=".75" y=".75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>
    <text x="64" y="94" text-anchor="middle" fill="#ffffff" font-family="Georgia,'Times New Roman',serif" font-size="88" font-weight="700">π</text>
  </g>
  <text x="252" y="112" fill="#8e8e99" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="15" letter-spacing="4">FOR OH-MY-PI</text>
  <text x="250" y="170" fill="#f7f7f8" font-family="Geist,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" letter-spacing="-2">OMP <tspan fill="url(#text)">Control Room</tspan></text>
  <text x="252" y="212" fill="#a8a8b3" font-family="Geist,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21">One browser tab for every OMP session, across all your projects.</text>
</svg>
