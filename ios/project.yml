name: OMPCompanion
options:
  bundleIdPrefix: dev.omp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
packages:
  OMPCompanionKit:
    path: OMPCompanionKit
targets:
  OMPCompanion:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OMPCompanion
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.omp.companion
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: OMPCompanion/Info.plist
    dependencies:
      - package: OMPCompanionKit
schemes:
  OMPCompanion:
    build:
      targets:
        OMPCompanion: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OMPCompanionKit/OMPCompanionKitTests
          parallelizable: true
