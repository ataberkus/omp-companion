# Runs the OMPCompanionKit unit tests (ios/OMPCompanionKit/Tests) on an iOS simulator whenever the iOS app's code changes.
# The Xcode project is generated from ios/project.yml; its OMPCompanion scheme carries the package's test target.
# The simulator is the newest available iPhone on the runner's newest iOS runtime. Nothing is signed or uploaded.
name: iOS tests

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate project
        working-directory: ios
        run: |
          xcodegen generate --quiet
          xcodebuild -version
      - name: Pick simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-[0-9-]+$")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | map(.value[] | select(.name | startswith("iPhone")))
            | last | .udid // empty')
          [ -n "$udid" ] || { echo "::error::No available iPhone simulator"; xcrun simctl list devices available; exit 1; }
          xcrun simctl list devices available | grep "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: Test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project OMPCompanion.xcodeproj -scheme OMPCompanion \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO
