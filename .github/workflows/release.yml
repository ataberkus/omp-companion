# Pushing a tag vX.Y.Z builds the Windows installer and the macOS apps (Apple silicon and Intel), and publishes them as a
# GitHub release with latest.json, which installed apps poll for updates. Needs repo secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the updater key pair; the public half is in src-tauri/tauri.conf.json).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      # One platform at a time: each job creates the release if it is missing and adds its platform to latest.json, so
      # jobs running side by side could create two releases or overwrite each other's latest.json.
      max-parallel: 1
      matrix:
        include:
          - { name: Windows, runner: windows-latest }
          # Each Mac build runs on its own CPU: build.rs bundles the runner's Bun, and npm ci installs OMP's native
          # modules for the runner's architecture.
          - { name: macOS Apple silicon, runner: macos-latest }
          - { name: macOS Intel, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # build.rs copies this Bun into the app: it is the runtime the app ships with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tag matches the app version
        shell: pwsh
        run: |
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $tag = '${{ github.ref_name }}'
          if ($tag -ne "v$conf" -or $pkg -ne $conf -or $cargo -ne $conf) {
            Write-Error "Tag $tag does not match the versions: tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo"
            exit 1
          }

      # One test file at a time: tests/frontend-render.test.mjs times markdown rendering against a 50 ms budget, which
      # parallel test files competing for the runner's few cores can exceed.
      - run: node --test --test-concurrency=1 "tests/*.test.mjs"

      # Spotlight indexes the disk image tauri build mounts to make the .dmg; on the slower Intel runner that kept the
      # image busy past hdiutil's detach timeout ("timeout for DiskArbitration expired").
      - name: Keep Spotlight off disk images
        if: runner.os == 'macOS'
        run: sudo mdutil -a -i off

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: OMP Control Room ${{ github.ref_name }}
          releaseBody: See the commits since the previous release.
          releaseDraft: false
          prerelease: false
