<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OMP Control Room</title>
<link rel="icon" href="/favicon.svg"/>
<link rel="stylesheet" href="/app.css"/>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">π</div>
      <div class="brand-text"><b>OMP</b><span>Control Room</span></div>
      <span class="conn" id="conn" title="Connection"></span>
    </div>
    <button class="btn primary new-btn" id="newBtn"><span>＋</span> New session <kbd>Alt N</kbd></button>
    <div class="search-wrap">
      <input id="search" class="search" placeholder="Search sessions…" autocomplete="off"/>
      <kbd>/</kbd>
    </div>
    <div class="filters" id="filters">
      <button data-filter="all" class="on">All</button>
      <button data-filter="active">Active</button>
      <button data-filter="panel">In panel</button>
    </div>
    <div class="session-list" id="list"></div>
    <div class="sidebar-foot">
      <a href="#/settings" title="Every OMP setting, editable">⚙ Settings</a>
      <button class="link" id="disconnect">Disconnect</button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
</div>
<div class="toasts" id="toasts"></div>
<script src="/app.js"></script>
</body>
</html>
